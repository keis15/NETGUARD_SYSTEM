<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .t{font-size:17px;font-weight:600;fill:#0f172a}
      .s{font-size:13.5px;fill:#334155}
      .l{font-size:13px;fill:#475569;font-style:italic}
      .ln{stroke:#334155;stroke-width:2;fill:none}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1600" height="1140" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">NetGuard: System Architecture</text>

  <!-- External actors -->
  <rect x="60" y="90" width="440" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="280" y="122" text-anchor="middle" class="t">Admin's browser: React SPA</text>
  <text x="280" y="146" text-anchor="middle" class="s">Dashboard · Devices · Network Scan · Website Activity</text>
  <text x="280" y="168" text-anchor="middle" class="s">Access Control · Reports · Settings (Vite + Recharts)</text>

  <rect x="560" y="90" width="440" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="780" y="122" text-anchor="middle" class="t">LAN devices (phones, laptops, TVs…)</text>
  <text x="780" y="146" text-anchor="middle" class="s">on the same Wi-Fi subnet; use this PC as DNS</text>
  <text x="780" y="168" text-anchor="middle" class="s">when router DHCP points DNS here</text>

  <rect x="1060" y="90" width="480" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1300" y="122" text-anchor="middle" class="t">Wi-Fi router / upstream DNS</text>
  <text x="1300" y="146" text-anchor="middle" class="s">default gateway (e.g. 192.168.1.1)</text>
  <text x="1300" y="168" text-anchor="middle" class="s">answers relayed back unchanged</text>

  <!-- Process container -->
  <rect x="40" y="240" width="1520" height="720" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="590" y="955" font-size="14" font-weight="700" fill="#475569">NetGuard process: run.py → uvicorn (Python, single process, background threads)</text>

  <!-- Column A -->
  <rect x="70" y="290" width="400" height="160" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="320" text-anchor="middle" class="t">Web layer: FastAPI</text>
  <text x="270" y="346" text-anchor="middle" class="s">main.py: app factory, lifespan,</text>
  <text x="270" y="366" text-anchor="middle" class="s">serves built SPA (frontend/dist)</text>
  <text x="270" y="392" text-anchor="middle" class="s">api.py: /api REST endpoints</text>
  <text x="270" y="412" text-anchor="middle" class="s">devices · scan · activity · filter</text>
  <text x="270" y="432" text-anchor="middle" class="s">reports (CSV) · settings · system</text>

  <rect x="70" y="500" width="400" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="530" text-anchor="middle" class="t">AppState (state.py)</text>
  <text x="270" y="556" text-anchor="middle" class="s">composition root: owns DB, Settings,</text>
  <text x="270" y="576" text-anchor="middle" class="s">Scanner, DnsMonitor, network info</text>
  <text x="270" y="602" text-anchor="middle" class="s">apply_settings(): start/stop components</text>
  <text x="270" y="622" text-anchor="middle" class="s">to match current configuration</text>
  <text x="270" y="648" text-anchor="middle" class="s">capture_ok(): Npcap + admin check</text>

  <rect x="70" y="740" width="400" height="190" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="770" text-anchor="middle" class="t">Scheduler thread</text>
  <text x="270" y="798" text-anchor="middle" class="s">auto-scan every scan_interval</text>
  <text x="270" y="822" text-anchor="middle" class="s">network re-detect every 60 s</text>
  <text x="270" y="846" text-anchor="middle" class="s">(rescan + re-apply DNS on change)</text>
  <text x="270" y="870" text-anchor="middle" class="s">retention purge every hour</text>

  <!-- Scanner -->
  <rect x="560" y="290" width="320" height="180" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="720" y="320" text-anchor="middle" class="t">Scanner (scanner.py)</text>
  <text x="720" y="346" text-anchor="middle" class="s">Npcap ARP scan ∥ Windows ping sweep</text>
  <text x="720" y="368" text-anchor="middle" class="s">merge with ARP / neighbor table</text>
  <text x="720" y="390" text-anchor="middle" class="s">reverse-DNS hostnames</text>
  <text x="720" y="412" text-anchor="middle" class="s">OUI vendor · randomized-MAC flag</text>
  <text x="720" y="434" text-anchor="middle" class="s">VMware guest networks (optional)</text>

  <!-- Platform helpers -->
  <rect x="1180" y="290" width="350" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1355" y="320" text-anchor="middle" class="t">Platform helpers</text>
  <text x="1355" y="348" text-anchor="middle" class="s">netinfo.py: detect Wi-Fi adapter, IP,</text>
  <text x="1355" y="368" text-anchor="middle" class="s">subnet, gateway, SSID (PowerShell)</text>
  <text x="1355" y="396" text-anchor="middle" class="s">settings.py: defaults + validation</text>
  <text x="1355" y="424" text-anchor="middle" class="s">winutil.py: admin / Npcap checks,</text>
  <text x="1355" y="444" text-anchor="middle" class="s">hidden subprocesses</text>

  <!-- DnsMonitor group -->
  <rect x="560" y="510" width="970" height="430" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="580" y="536" font-size="16" font-weight="700" fill="#9d174d">DnsMonitor (dns_monitor.py)</text>

  <rect x="590" y="560" width="240" height="120" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1.6"/>
  <text x="710" y="590" text-anchor="middle" class="t">FilterPolicy</text>
  <text x="710" y="614" text-anchor="middle" class="s">filtering.py</text>
  <text x="710" y="636" text-anchor="middle" class="s">blocklist or allowlist</text>
  <text x="710" y="658" text-anchor="middle" class="s">(kiosk) mode</text>

  <rect x="860" y="560" width="250" height="120" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="2.4"/>
  <text x="985" y="590" text-anchor="middle" class="t">DnsForwarder</text>
  <text x="985" y="614" text-anchor="middle" class="s">UDP + TCP port 53</text>
  <text x="985" y="636" text-anchor="middle" class="s">logs name + client IP,</text>
  <text x="985" y="658" text-anchor="middle" class="s">relays query upstream</text>

  <rect x="1180" y="560" width="320" height="120" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1.6"/>
  <text x="1340" y="590" text-anchor="middle" class="t">DnsSniffer (passive)</text>
  <text x="1340" y="614" text-anchor="middle" class="s">Npcap capture on Wi-Fi adapter</text>
  <text x="1340" y="636" text-anchor="middle" class="s">sees only this PC's own lookups</text>
  <text x="1340" y="658" text-anchor="middle" class="s">(WPA2/3 isolates other clients)</text>

  <rect x="590" y="730" width="240" height="110" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1.6"/>
  <text x="710" y="760" text-anchor="middle" class="t">dns_parse.py</text>
  <text x="710" y="784" text-anchor="middle" class="s">parse DNS questions,</text>
  <text x="710" y="806" text-anchor="middle" class="s">normalise domains,</text>
  <text x="710" y="828" text-anchor="middle" class="s">build block replies</text>

  <rect x="860" y="730" width="250" height="110" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1.6"/>
  <text x="985" y="760" text-anchor="middle" class="t">BlockPageServer</text>
  <text x="985" y="784" text-anchor="middle" class="s">small HTTP server:</text>
  <text x="985" y="806" text-anchor="middle" class="s">"site not allowed" page</text>
  <text x="985" y="828" text-anchor="middle" class="s">(clean over http:// only)</text>

  <rect x="1180" y="730" width="320" height="110" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="2.4"/>
  <text x="1340" y="760" text-anchor="middle" class="t">DnsRecorder</text>
  <text x="1340" y="784" text-anchor="middle" class="s">in-memory queue, flush every 2 s</text>
  <text x="1340" y="806" text-anchor="middle" class="s">aggregate per (IP, domain, minute)</text>
  <text x="1340" y="828" text-anchor="middle" class="s">map IP → MAC from devices</text>

  <text x="1045" y="905" text-anchor="middle" class="l">Privacy: only domain name + client IP + time are stored. No URLs, payloads, or decryption.</text>

  <!-- Database -->
  <path d="M70,1000 a730,18 0 0,0 1460,0 v70 a730,18 0 0,1 -1460,0 z" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <ellipse cx="800" cy="1000" rx="730" ry="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="800" y="1048" text-anchor="middle" class="t">SQLite database: data/netguard.db (WAL) via db.py</text>
  <text x="800" y="1072" text-anchor="middle" class="s">tables: devices · scans · dns_activity · settings</text>

  <!-- Arrows -->
  <line x1="440" y1="190" x2="440" y2="288" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="452" y="232" class="l">HTTP/JSON · 127.0.0.1:8600</text>

  <line x1="270" y1="450" x2="270" y2="498" class="ln" marker-end="url(#a)"/>
  <line x1="270" y1="700" x2="270" y2="738" class="ln" marker-end="url(#a)"/>
  <line x1="270" y1="930" x2="270" y2="1008" class="ln" marker-end="url(#a)"/>
  <text x="282" y="972" class="l">purge old activity</text>

  <line x1="470" y1="540" x2="558" y2="430" class="ln" marker-end="url(#a)"/>
  <line x1="470" y1="640" x2="558" y2="640" class="ln" marker-end="url(#a)"/>
  <text x="476" y="630" class="l">apply()</text>

  <line x1="690" y1="290" x2="690" y2="192" class="ln dash" marker-end="url(#a)"/>
  <text x="700" y="232" class="l">ARP + ping probes</text>

  <line x1="940" y1="192" x2="940" y2="558" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="950" y="300" class="l">DNS queries</text>
  <text x="950" y="318" class="l">port 53</text>

  <line x1="1090" y1="558" x2="1090" y2="192" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1100" y="420" class="l">forward /</text>
  <text x="1100" y="438" class="l">answers</text>

  <line x1="860" y1="620" x2="832" y2="620" class="ln" marker-end="url(#a)"/>
  <line x1="985" y1="680" x2="985" y2="728" class="ln" marker-end="url(#a)"/>
  <text x="993" y="710" class="l">blocked → this PC's IP</text>
  <line x1="1110" y1="670" x2="1178" y2="752" class="ln" marker-end="url(#a)"/>
  <line x1="1340" y1="680" x2="1340" y2="728" class="ln" marker-end="url(#a)"/>
  <line x1="1340" y1="840" x2="1340" y2="1008" class="ln" marker-end="url(#a)"/>
  <text x="1350" y="972" class="l">batch insert dns_activity</text>
</svg>
